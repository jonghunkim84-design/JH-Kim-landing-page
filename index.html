<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김종헌 | 프로젝트 관리자</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Nanum Gothic', sans-serif;
      background: linear-gradient(160deg, #fdf6ec 0%, #f5e6c8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 48px;
      color: #2c1f0f;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 253, 248, 0.85);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(160, 100, 40, 0.14);
      overflow: hidden;
    }

    /* ── 헤더: 이름 & 역할 ── */
    .header {
      background: linear-gradient(135deg, #7a4f2a 0%, #c8874a 100%);
      color: #fff;
      text-align: center;
      padding: 40px 24px 30px;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      margin-bottom: 10px;
    }

    .header .role {
      font-size: 1.02rem;
      letter-spacing: 0.08em;
      opacity: 0.92;
    }

    /* ── 주요 경력 ── */
    .career {
      padding: 28px 26px 22px;
      border-bottom: 1px solid rgba(180, 120, 50, 0.18);
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #c8874a;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .career-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 13px;
    }

    .career-item:last-child {
      margin-bottom: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      min-width: 8px;
      border-radius: 50%;
      background: #c8874a;
      margin-top: 7px;
    }

    .career-item span {
      font-size: 0.97rem;
      line-height: 1.6;
      color: #2c1f0f;
    }

    .career-item strong {
      color: #7a4f2a;
    }

    /* ── 사진 & 연락처 ── */
    .profile {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 24px 26px;
      border-bottom: 1px solid rgba(180, 120, 50, 0.18);
    }

    /* 프로필 사진 - 실제 사진으로 교체하려면:
       1. 사진 파일(예: photo.jpg)을 index.html과 같은 폴더에 저장
       2. 아래 <div class="photo-box"> 전체를
          <img src="photo.jpg" class="real-photo" alt="김종헌 사진">
          으로 교체 */
    .photo-box {
      flex-shrink: 0;
      width: 92px;
      height: 112px;
      border-radius: 12px;
      background: linear-gradient(175deg, #b8b0a4 0%, #7a7068 100%);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .real-photo {
      flex-shrink: 0;
      width: 92px;
      height: 112px;
      border-radius: 12px;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.05);
    }

    .contact {
      flex: 1;
    }

    .contact-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .contact-row:last-child {
      margin-bottom: 0;
    }

    .contact-icon {
      font-size: 1rem;
      min-width: 20px;
      text-align: center;
      margin-top: 1px;
    }

    .contact-row a {
      font-size: 0.93rem;
      line-height: 1.45;
      color: #2c1f0f;
      text-decoration: none;
      word-break: break-all;
    }

    .contact-row a:hover {
      color: #7a4f2a;
      text-decoration: underline;
    }

    /* ── 액션 버튼 ── */
    .actions {
      display: flex;
      gap: 12px;
      padding: 22px 26px 30px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 15px 8px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.12s, opacity 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    .btn-call {
      background: linear-gradient(135deg, #7a4f2a 0%, #c8874a 100%);
      color: #fff;
    }

    .btn-email {
      background: #fff;
      color: #7a4f2a;
      border: 2px solid #c8874a;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- 이름 & 역할 -->
    <header class="header">
      <h1>김 종 헌</h1>
      <p class="role">프로젝트 관리자 (Project Manager)</p>
    </header>

    <!-- 주요 경력 -->
    <section class="career">
      <p class="section-label">주요 경력</p>
      <div class="career-item">
        <div class="dot"></div>
        <span>SCM 전문가 <strong>20년</strong></span>
      </div>
      <div class="career-item">
        <div class="dot"></div>
        <span>ERP 구축 컨설턴트 <strong>10년</strong></span>
      </div>
      <div class="career-item">
        <div class="dot"></div>
        <span>프로젝트 매니저 <strong>(PMP)</strong></span>
      </div>
    </section>

    <!-- 사진 & 연락처 -->
    <section class="profile">
      <!-- 사진 자리표시자 (교체 방법은 위 CSS 주석 참고) -->
      <div class="photo-box" role="img" aria-label="프로필 사진">
        <svg width="92" height="98" viewBox="0 0 92 98" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="46" cy="32" r="22" fill="#ddd6cc"/>
          <ellipse cx="46" cy="92" rx="42" ry="32" fill="#ccc4b8"/>
          <ellipse cx="46" cy="72" rx="20" ry="12" fill="#c0b8ac"/>
        </svg>
      </div>

      <div class="contact">
        <div class="contact-row">
          <span class="contact-icon">📞</span>
          <a href="tel:01030989055">010-3098-9055</a>
        </div>
        <div class="contact-row">
          <span class="contact-icon">✉️</span>
          <a href="mailto:jonghun.kim84@gmail.com">jonghun.kim84@gmail.com</a>
        </div>
      </div>
    </section>

    <!-- 액션 버튼 -->
    <div class="actions">
      <a href="tel:01030989055" class="btn btn-call">
        📞 전화 걸기
      </a>
      <a href="mailto:jonghun.kim84@gmail.com" class="btn btn-email">
        ✉️ 이메일
      </a>
    </div>

  </div>
</body>
</html>
