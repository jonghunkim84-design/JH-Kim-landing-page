  <text x="288" y="132" fill="#64748B" font-size="11">국민연금 + 개인연금 합산</text>

  <!-- card 3: AI 어드바이저 -->
  <rect x="532" y="60" width="252" height="86" rx="8" fill="#1E293B"/>
  <rect x="532" y="60" width="4" height="86" rx="2" fill="#3B82F6"/>
