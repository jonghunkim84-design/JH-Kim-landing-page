  <text x="614" y="210" fill="#22C55E" font-size="11.5">+12.4%</text>
  <text x="710" y="210" fill="#94A3B8" font-size="11.5">16.1%</text>
  <line x1="392" y1="218" x2="784" y2="218" stroke="#334155" stroke-width="1"/>

  <text x="406" y="237" fill="#F1F5F9" font-size="11.5">KODEX 200</text>
  <text x="510" y="237" fill="#F1F5F9" font-size="11.5">4,110만</text>
  <text x="614" y="237" fill="#22C55E" font-size="11.5">+7.8%</text>
  <text x="710" y="237" fill="#94A3B8" font-size="11.5">12.7%</text>
  <line x1="392" y1="245" x2="784" y2="245" stroke="#334155" stroke-width="1"/>

  <text x="406" y="264" fill="#F1F5F9" font-size="11.5">국고채 3년</text>
  <text x="510" y="264" fill="#F1F5F9" font-size="11.5">3,800만</text>
  <text x="614" y="264" fill="#EF4444" font-size="11.5">-1.2%</text>
  <text x="710" y="264" fill="#94A3B8" font-size="11.5">11.7%</text>
  <line x1="392" y1="272" x2="784" y2="272" stroke="#334155" stroke-width="1"/>

  <text x="406" y="291" fill="#F1F5F9" font-size="11.5">리츠 ETF</text>
  <text x="510" y="291" fill="#F1F5F9" font-size="11.5">3,200만</text>
  <text x="614" y="291" fill="#22C55E" font-size="11.5">+4.1%</text>
  <text x="710" y="291" fill="#94A3B8" font-size="11.5">9.9%</text>
  <line x1="392" y1="299" x2="784" y2="299" stroke="#334155" stroke-width="1"/>

  <text x="406" y="318" fill="#94A3B8" font-size="11.5">현금성자산</text>
  <text x="510" y="318" fill="#94A3B8" font-size="11.5">2,600만</text>
  <text x="614" y="318" fill="#94A3B8" font-size="11.5">+0.4%</text>
  <text x="710" y="318" fill="#94A3B8" font-size="11.5">8.0%</text>
  <line x1="392" y1="326" x2="784" y2="326" stroke="#334155" stroke-width="1"/>

  <text x="406" y="345" fill="#64748B" font-size="11">합계</text>
  <text x="510" y="345" fill="#F1F5F9" font-size="11.5" font-weight="600">3억 2,450만</text>
  <text x="710" y="345" fill="#94A3B8" font-size="11.5">100%</text>

  <!-- pension simulator bottom bar -->
  <rect x="16" y="386" width="768" height="92" rx="8" fill="#1E293B"/>
  <rect x="16" y="386" width="4" height="92" rx="2" fill="#3B82F6"/>
  <text x="36" y="408" fill="#3B82F6" font-size="10.5" font-weight="700" letter-spacing="1">연금 세금 시뮬레이션</text>
  <text x="36" y="430" fill="#F1F5F9" font-size="12.5">연분리과세 선택 시 예상 납부세액</text>
  <rect x="36" y="440" width="260" height="12" rx="4" fill="#334155"/>
  <rect x="36" y="440" width="175" height="12" rx="4" fill="#3B82F6"/>
  <text x="306" y="451" fill="#F59E0B" font-size="12" font-weight="600">₩ 124만 / 년</text>
  <text x="36" y="468" fill="#64748B" font-size="10.5">국민연금 + 개인연금 합산 기준 · 종합과세 대비 ₩38만 절감</text>
</svg>
