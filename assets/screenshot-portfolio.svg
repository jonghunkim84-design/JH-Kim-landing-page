<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"
     font-family="system-ui, -apple-system, sans-serif">

  <!-- background -->
  <rect width="800" height="500" fill="#0F172A"/>

  <!-- top nav -->
  <rect width="800" height="46" fill="#1E293B"/>
  <rect x="16" y="13" width="20" height="20" rx="5" fill="#3B82F6"/>
  <text x="44" y="28" fill="#F1F5F9" font-size="13" font-weight="600">자산 포트폴리오 AI</text>
  <text x="560" y="28" fill="#94A3B8" font-size="12">대시보드</text>
  <text x="626" y="28" fill="#94A3B8" font-size="12">포트폴리오</text>
  <text x="708" y="28" fill="#94A3B8" font-size="12">설정</text>

  <!-- summary cards row -->
  <!-- card 1: 총 자산 (DEMO) -->
  <rect x="16" y="60" width="238" height="86" rx="8" fill="#1E293B"/>
  <text x="30" y="80" fill="#94A3B8" font-size="10.5">총 자산 (DEMO)</text>
  <text x="30" y="112" fill="#F1F5F9" font-size="22" font-weight="700">₩ 3.24억</text>
  <text x="30" y="132" fill="#22C55E" font-size="11">▲ +8.2%  전년 대비</text>

  <!-- card 2: 월 연금 예상 -->
  <rect x="274" y="60" width="238" height="86" rx="8" fill="#1E293B"/>
