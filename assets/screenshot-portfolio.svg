  <rect x="392" y="162" width="392" height="30" rx="8" fill="#334155"/>
  <rect x="392" y="178" width="392" height="14" fill="#334155"/>
  <text x="406" y="182" fill="#94A3B8" font-size="10.5">종목명</text>
