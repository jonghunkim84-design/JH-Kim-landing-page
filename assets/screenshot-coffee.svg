  <text x="476" y="426" fill="#1E293B" font-size="11">에스프레소 원두 A — Lot #2024-05</text>
  <text x="476" y="444" fill="#64748B" font-size="10.5">입고: 2026-05-08 · 잔여: 0.8 kg · 유통기한: 2026-11-08</text>
